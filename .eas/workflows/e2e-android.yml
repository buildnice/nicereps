name: Android e2e

on:
  workflow_dispatch: {}

jobs:
  build:
    type: build
    params:
      platform: android
      profile: preview
  maestro:
    needs: [build]
    type: maestro
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: .maestro
      record_screen: true
