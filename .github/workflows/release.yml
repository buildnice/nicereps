name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version not yet released
        run: |
          TAG="v$(jq -er .expo.version app.json)"
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/$TAG" || rc=$?
          if [ "$rc" != 2 ]; then echo "::error::$TAG already exists or the tag check failed"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to Play closed testing
        run: eas build -p android -e production --auto-submit --wait --non-interactive
      - name: Build signed APK
        run: eas build -p android -e apk --wait --non-interactive --json > apk.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o "nicereps-$TAG.apk" "$(jq -r '.[0].artifacts.buildUrl' apk.json)"
          gh release create "$TAG" "nicereps-$TAG.apk" --target "$GITHUB_SHA" --generate-notes
