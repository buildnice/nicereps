appId: com.buildnice.nicereps
name: Editing a completed set's rest retimes the running rest
---
- runFlow: common/launch.yml
- tapOn: Start workout
- tapOn: Fresh workout
- runFlow: {file: common/add-exercise.yml, env: {QUERY: Bench Press - Medium, NAME: Barbell Bench Press - Medium Grip}}
- runFlow: {file: common/set.yml, env: {N: "1", WEIGHT: "60", REPS: "5"}}
- runFlow: {file: common/expand.yml, env: {NAME: Barbell Bench Press - Medium Grip}}
- assertVisible: "of 2:00.*"
- swipe:
    from: "Set 1 reps.*"
    direction: LEFT
- tapOn: Set 1 options
- tapOn: Rest
- tapOn: "Set 1 Rest, 2:00"
- runFlow: {file: common/type.yml, env: {KEYS: "300"}}
- tapOn: Done
# The new length counts from the completion; the screenshot shows the time already spent kept.
- assertVisible: "of 3:00.*"
# A length that has already passed ends the rest.
- tapOn: "Set 1 Rest, 3:00"
- runFlow: {file: common/type.yml, env: {KEYS: "5"}}
- tapOn: Done
- extendedWaitUntil:
    notVisible: Stop timer
    timeout: 4000
