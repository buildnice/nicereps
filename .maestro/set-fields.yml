appId: com.buildnice.nicereps
name: A set's ⋮ opens a sheet of field switches; switched-on fields stay in the row, switched-off ones keep their values
---
- runFlow: common/launch.yml
- tapOn: Start workout
- tapOn: Fresh workout
- runFlow: {file: common/add-exercise.yml, env: {QUERY: Bench Press - Medium, NAME: Barbell Bench Press - Medium Grip}}
- runFlow: {file: common/set.yml, env: {N: "1", WEIGHT: "90", REPS: "12"}}
- runFlow: {file: common/expand.yml, env: {NAME: Barbell Bench Press - Medium Grip}}
- swipe: {from: "Set 1 reps.*", direction: LEFT}
- tapOn: Set 1 options
# Several fields switch on from one sheet.
- tapOn: Set 1 Target RPE
- tapOn: Set 1 RPE
- tapOn: Set 1 Comment
- assertVisible: {text: Set 1 RPE, checked: true}
- takeScreenshot: set-fields-sheet
- tapOn: Done
# The sheet leaves no switches behind; the fields sit in the row.
- assertNotVisible: Done
- assertNotVisible: Set 1 Target RPE
- assertVisible: "Set 1 Target RPE, empty"
- tapOn: "Set 1 RPE, empty"
- runFlow: {file: common/type.yml, env: {KEYS: "8"}}
- tapOn: Done
- tapOn: Set 1 comment
- inputText: Sluggish
- hideKeyboard
- assertVisible: "Set 1 RPE, 8"
- takeScreenshot: set-fields-row
# Switching a field off hides it and keeps its value.
- swipe: {from: "Set 1 reps.*", direction: LEFT}
- tapOn: Set 1 options
- tapOn: Set 1 RPE
- tapOn: Set 1 Comment
- tapOn: Done
- assertNotVisible: "Set 1 RPE.*"
- assertNotVisible: Set 1 comment
- assertVisible: "Set 1 Target RPE, empty"
- swipe: {from: "Set 1 reps.*", direction: LEFT}
- tapOn: Set 1 options
- tapOn: Set 1 RPE
- tapOn: Set 1 Comment
- tapOn: Done
- assertVisible: "Set 1 RPE, 8"
- assertVisible: Sluggish
