appId: com.buildnice.nicereps
name: Stats show the logged volume, PR and lift
---
- runFlow: common/launch.yml
- runFlow: common/bench-workout.yml
- back
- scrollUntilVisible:
    element: "Show all, .*1 lift"
- tapOn: "Show all, .*1 lift"
- assertVisible: 300 kg
- assertVisible: ".*Weight 60 kg × 5.*"
- scrollUntilVisible:
    element: "Barbell Bench Press - Medium Grip, Best e1RM.*"
- tapOn: "Barbell Bench Press - Medium Grip, Best e1RM.*"
- assertVisible: History
- assertVisible: "Set 1, 60 kg × 5"
- tapOn: Records
- assertVisible: "60 kg, 5 reps.*"
- tapOn: Reps
- assertVisible: "5 reps, 60 kg.*"
- back
- back
- tapOn: Start workout
- tapOn: Fresh workout
- runFlow: {file: common/add-exercise.yml, env: {QUERY: Bench Press - Medium, NAME: Barbell Bench Press - Medium Grip}}
- tapOn: Barbell Bench Press - Medium Grip options
- tapOn: History
- assertVisible: "Set 1, 60 kg × 5"
- back
- assertVisible: Barbell Bench Press - Medium Grip options
