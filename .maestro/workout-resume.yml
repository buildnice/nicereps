appId: com.buildnice.nicereps
name: A killed workout resumes with its edits
---
- runFlow: common/launch.yml
- tapOn: Start workout
- tapOn: Fresh workout
- runFlow: {file: common/add-exercise.yml, env: {QUERY: Bench Press - Medium, NAME: Barbell Bench Press - Medium Grip}}
- runFlow: {file: common/set.yml, env: {N: "1", WEIGHT: "60", REPS: "5"}}
- runFlow: {file: common/expand.yml, env: {NAME: Barbell Bench Press - Medium Grip}}
- tapOn: Add set
- scrollUntilVisible:
    element: Set 2 weight.*
- tapOn: Set 2 weight.*
- runFlow: {file: common/type.yml, env: {KEYS: "70"}}
- tapOn: Done
- stopApp
# The app reopens straight into the interrupted workout.
- launchApp
- scrollUntilVisible:
    element: "Set 2 weight, 70"
- runFlow: common/finish.yml
- back
- scrollUntilVisible:
    element: Start workout
    direction: UP
- scrollUntilVisible:
    element: "Workout, .* sets?"
